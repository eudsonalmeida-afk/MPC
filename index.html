<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertório MPC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');

        :root {
            --bg-claro: #e3e1e6;
            --bege-claro: #e1d1b8;
            --bege-medio: #d9bf9e;
            --marrom-escuro: #5b484a;
            --marrom-terracota: #8b5843;
        }

        body { font-family: 'Georgia', serif; background-color: var(--bg-claro); color: var(--marrom-escuro); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(91, 72, 74, 0.1); position: relative;}
        
        .titulo-app { text-align: center; color: var(--marrom-escuro); margin-bottom: 30px; font-size: 2.2em; }
        
        .destaque-mpc {
            font-family: 'Caveat', cursive;
            font-size: 1.3em;
            letter-spacing: 2px;
            color: var(--marrom-terracota);
            background-color: var(--bege-claro);
            padding: 2px 18px;
            border-radius: 20px;
            box-shadow: 2px 2px 5px rgba(91, 72, 74, 0.15);
            display: inline-block;
            margin-left: 8px;
        }

        h2 { text-align: center; color: var(--marrom-terracota); margin-top: 0; }

        .form-adicionar, .filtros-container { background-color: var(--bege-claro); padding: 20px; border-radius: 10px; margin-bottom: 30px; border: 1px solid var(--bege-medio); }
        
        .linha-inputs { display: flex; gap: 15px; align-items: flex-end; margin-bottom: 15px; }
        .grupo-flex { flex: 1; }
        .grupo-pequeno { width: 90px; }

        label { display: block; margin-bottom: 5px; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid var(--marrom-escuro); border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; margin-bottom: 15px; }
        select { background-color: #fff; }
        
        .checkbox-container { display: flex; align-items: center; margin-bottom: 15px; }
        .btn-adicionar { background-color: var(--marrom-escuro); color: var(--bg-claro); width: 100%; border: none; padding: 12px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-adicionar:hover { background-color: #403234; }
        .btn-cancelar { background-color: #9e9e9e; color: #fff; width: 100%; border: none; padding: 12px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-cancelar:hover { background-color: #757575; }

        .categoria { background-color: var(--bege-claro); margin-bottom: 20px; padding: 15px; border-radius: 10px; }
        .categoria-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bege-medio); padding-bottom: 5px; margin-bottom: 10px; }
        .categoria-header h3 { margin: 0; color: var(--marrom-escuro); display: flex; align-items: center; gap: 8px; font-size: 1.1em; user-select: none; }
        .categoria-header h3:hover { opacity: 0.8; }
        
        .btn-remover-cat { font-size: 0.6em; background-color: transparent; color: var(--marrom-terracota); border: 1px solid var(--marrom-terracota); padding: 4px 8px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .btn-remover-cat:hover { background-color: var(--marrom-terracota); color: var(--bg-claro); }
        
        .musica-item-container { background-color: #ffffff; margin: 10px 0; padding: 10px; border-radius: 8px; transition: 0.2s; }
        .musica-linha { display: flex; align-items: center; width: 100%; cursor: pointer; flex-wrap: wrap; gap: 5px; }
        .harmonia-vocal { background-color: var(--bege-medio) !important; border-left: 5px solid var(--marrom-terracota) !important; }
        
        .sombra-comum { box-shadow: 0px 3px 12px rgba(76, 175, 80, 0.4); } 
        .sombra-natal { box-shadow: 0px 3px 12px rgba(100, 181, 246, 0.5); border: 1px solid rgba(100, 181, 246, 0.3); } 
        .sombra-advento-quaresma { box-shadow: 0px 3px 12px rgba(156, 39, 176, 0.35); } 
        .sombra-festa { box-shadow: 0px 3px 12px rgba(229, 57, 53, 0.4); } 
        .sombra-pascoa { box-shadow: 0px 3px 12px rgba(255, 193, 7, 0.5); border: 1px solid rgba(255, 193, 7, 0.4); } 
        .sombra-geral { box-shadow: 0px 3px 12px rgba(158, 158, 158, 0.3); } 

        .tag-vozes { font-size: 0.75em; background-color: var(--marrom-terracota); color: var(--bg-claro); padding: 3px 8px; border-radius: 12px; font-family: sans-serif; margin-left: 5px;}
        .tag-tom { font-size: 0.85em; background-color: var(--bege-claro); color: var(--marrom-escuro); padding: 2px 6px; border-radius: 5px; font-weight: bold; border: 1px solid var(--bege-medio); }
        .tag-tempo { font-size: 0.75em; background-color: var(--marrom-escuro); color: var(--bege-claro); padding: 3px 8px; border-radius: 12px; font-family: sans-serif; }
        
        .letra-detalhes { margin-top: 10px; margin-left: 32px; font-size: 0.95em; color: var(--marrom-escuro); }
        .letra-detalhes summary { cursor: pointer; color: var(--marrom-terracota); font-weight: bold; font-style: italic; outline: none; }
        .letra-texto { margin-top: 8px; background-color: var(--bg-claro); padding: 10px; border-radius: 5px; white-space: pre-wrap; font-family: 'Georgia', serif; }

        /* Ações das músicas */
        .acoes-musica { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .btn-editar-musica { background: none; border: none; color: #d9bf9e; cursor: pointer; font-size: 1.2em; padding: 0; transition: 0.2s;}
        .btn-editar-musica:hover { color: var(--marrom-terracota); }
        .btn-remover-musica { background: none; border: none; color: #d9534f; cursor: pointer; font-size: 1.2em; padding: 0; }

        input[type="checkbox"].check-lista { margin-right: 8px; transform: scale(1.3); accent-color: var(--marrom-terracota); }

        .controles { background-color: var(--bege-claro); padding: 20px; border-radius: 10px; text-align: center; margin-top: 30px; }
        .controles button { background-color: var(--marrom-terracota); color: var(--bg-claro); border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: 0.3s; margin-left: 10px; }
        .controles button:hover { background-color: var(--marrom-escuro); }

        #lista-final-container { display: none; margin-top: 30px; padding: 20px; border: 2px dashed var(--marrom-escuro); border-radius: 10px; background-color: #ffffff; }
        #lista-final-conteudo { list-style-type: none; padding: 0; }
        #lista-final-conteudo li { padding: 12px 0; border-bottom: 1px solid var(--bg-claro); }
        #lista-final-conteudo li strong { color: var(--marrom-terracota); }
        
        /* Modal de Edição */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(91, 72, 74, 0.7); }
        .modal-content { background-color: #ffffff; margin: 5% auto; padding: 25px; width: 90%; max-width: 500px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 2px solid var(--bege-medio); }
        .modal-botoes { display: flex; gap: 10px; margin-top: 15px; }

        @media (max-width: 500px) {
            .linha-inputs { flex-direction: column; gap: 10px; align-items: stretch; }
            .grupo-pequeno { width: 100%; }
            .modal-content { margin: 10% auto; padding: 15px; width: 95%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="titulo-app">Repertório <span class="destaque-mpc">MPC</span></h1>
    
    <!-- Formulário de Adição -->
    <div class="form-adicionar">
        <h2>Adicionar Música</h2>
        
        <div class="linha-inputs">
            <div class="grupo-flex">
                <label for="tempo-musica"><strong>Tempo Litúrgico:</strong></label>
                <select id="tempo-musica" onchange="toggleFestaInput()">
                    <option value="Geral (Qualquer Tempo)">Geral (Qualquer Tempo)</option>
                    <option value="Advento">Advento</option>
                    <option value="Natal">Natal</option>
                    <option value="Quaresma">Quaresma</option>
                    <option value="Tempo da Páscoa">Tempo da Páscoa</option>
                    <option value="Tempo Comum">Tempo Comum</option>
                    <option value="Festa">Festa / Solenidade (Especificar)</option>
                </select>
                <input type="text" id="tempo-festa" placeholder="Qual festa? Ex: Padroeiro, Ramos..." style="display: none; margin-top: 8px;">
            </div>
            <div class="grupo-flex">
                <label for="nova-categoria"><strong>Momento da Missa:</strong></label>
                <input type="text" id="nova-categoria" placeholder="Ex: Canto de Entrada..." required>
            </div>
        </div>

        <div class="linha-inputs">
            <div class="grupo-flex">
                <label for="nome-musica"><strong>Nome da Música:</strong></label>
                <input type="text" id="nome-musica" placeholder="Ex: Senhor, Tende Piedade" required>
            </div>
            <div class="grupo-pequeno">
                <label for="tom-musica"><strong>Tom:</strong></label>
                <input type="text" id="tom-musica" placeholder="Ex: G, Dm">
            </div>
        </div>

        <label for="letra-musica"><strong>Letra da Música (Opcional):</strong></label>
        <textarea id="letra-musica" rows="4" placeholder="Cole a letra completa aqui..."></textarea>

        <div class="checkbox-container">
            <input type="checkbox" id="tem-harmonia" class="check-lista">
            <label for="tem-harmonia">Tem harmonia vocal ensaiada?</label>
        </div>

        <button class="btn-adicionar" id="btn-salvar">Salvar Música no App</button>
    </div>

    <!-- Filtros Inteligentes -->
    <div class="filtros-container">
        <h3 style="margin-top: 0; color: var(--marrom-escuro); text-align: center;">Filtrar / Buscar Músicas</h3>
        <div class="linha-inputs" style="margin-bottom: 0;">
            <div class="grupo-flex">
                <label for="filtro-tempo"><strong>Por Tempo Litúrgico:</strong></label>
                <select id="filtro-tempo" onchange="renderizarLista()">
                    <option value="Todos">Todos os Tempos</option>
                </select>
            </div>
            <div class="grupo-flex">
                <label for="filtro-categoria"><strong>Por Categoria:</strong></label>
                <select id="filtro-categoria" onchange="renderizarLista()">
                    <option value="Todas">Todas as Categorias</option>
                </select>
            </div>
        </div>
    </div>

    <div id="categorias-container">
        <p style="text-align: center;">Carregando repertório...</p>
    </div>

    <!-- Controles de Geração de Lista -->
    <div class="controles">
        <label for="data-missa"><strong>Data da Missa:</strong></label>
        <input type="date" id="data-missa" required style="width: auto; display: inline-block;">
        <button id="btn-gerar-lista">Gerar Lista Final</button>
    </div>

    <div id="lista-final-container">
        <h2 id="titulo-lista">Lista da Missa</h2>
        <ul id="lista-final-conteudo"></ul>
    </div>
</div>

<!-- Modal de Edição -->
<div id="modal-edicao" class="modal">
    <div class="modal-content">
        <h2 style="margin-top: 0;">Editar Música</h2>
        
        <div class="linha-inputs">
            <div class="grupo-flex">
                <label for="edit-tempo"><strong>Tempo Litúrgico:</strong></label>
                <select id="edit-tempo" onchange="toggleFestaInputEdicao()">
                    <option value="Geral (Qualquer Tempo)">Geral (Qualquer Tempo)</option>
                    <option value="Advento">Advento</option>
                    <option value="Natal">Natal</option>
                    <option value="Quaresma">Quaresma</option>
                    <option value="Tempo da Páscoa">Tempo da Páscoa</option>
                    <option value="Tempo Comum">Tempo Comum</option>
                    <option value="Festa">Festa / Solenidade (Especificar)</option>
                </select>
                <input type="text" id="edit-tempo-festa" placeholder="Qual festa?" style="display: none; margin-top: 8px;">
            </div>
            <div class="grupo-flex">
                <label for="edit-categoria"><strong>Momento da Missa:</strong></label>
                <input type="text" id="edit-categoria" required>
            </div>
        </div>

        <div class="linha-inputs">
            <div class="grupo-flex">
                <label for="edit-nome"><strong>Nome da Música:</strong></label>
                <input type="text" id="edit-nome" required>
            </div>
            <div class="grupo-pequeno">
                <label for="edit-tom"><strong>Tom:</strong></label>
                <input type="text" id="edit-tom">
            </div>
        </div>

        <label for="edit-letra"><strong>Letra da Música:</strong></label>
        <textarea id="edit-letra" rows="4"></textarea>

        <div class="checkbox-container">
            <input type="checkbox" id="edit-harmonia" class="check-lista">
            <label for="edit-harmonia">Tem harmonia vocal ensaiada?</label>
        </div>

        <div class="modal-botoes">
            <button class="btn-cancelar" onclick="fecharModalEdicao()">Cancelar</button>
            <button class="btn-adicionar" id="btn-salvar-edicao">Salvar Alterações</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCom0Wd2TtFnkXzgJoolgexsFe2Znrxuds",
        authDomain: "mpceu-a93e3.firebaseapp.com",
        databaseURL: "https://mpceu-a93e3-default-rtdb.firebaseio.com",
        projectId: "mpceu-a93e3",
        storageBucket: "mpceu-a93e3.firebasestorage.app",
        messagingSenderId: "764031768022",
        appId: "1:764031768022:web:7d52c64b4d46865486c077",
        measurementId: "G-Q4B21EF7PN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const repertorioRef = ref(db, 'repertorio');

    let repertorio = {};
    let categoriasFechadas = new Set();
    
    // Variáveis para controle da edição
    let editandoId = null;
    let editandoCatOriginal = null;

    onValue(repertorioRef, (snapshot) => {
        repertorio = snapshot.val() || {};
        atualizarFiltrosDOM();
        renderizarLista();
    });

    window.toggleFestaInput = function() {
        const select = document.getElementById('tempo-musica');
        const inputFesta = document.getElementById('tempo-festa');
        if (select.value === 'Festa') {
            inputFesta.style.display = 'block';
            inputFesta.focus();
        } else {
            inputFesta.style.display = 'none';
        }
    }
    
    window.toggleFestaInputEdicao = function() {
        const select = document.getElementById('edit-tempo');
        const inputFesta = document.getElementById('edit-tempo-festa');
        if (select.value === 'Festa') {
            inputFesta.style.display = 'block';
            inputFesta.focus();
        } else {
            inputFesta.style.display = 'none';
        }
    }

    function normalizarCategoria(input) {
        const texto = input.toLowerCase().trim();
        if (texto.includes('entrada') || texto.includes('abertura')) return "Canto de Entrada";
        if (texto.includes('penitencial') || texto.includes('perdão') || texto.includes('perdao')) return "Ato Penitencial";
        if (texto.includes('glória') || texto.includes('gloria') || texto.includes('louvor')) return "Glória";
        if (texto.includes('aclamação') || texto.includes('aclamacao') || texto.includes('evangelho') || texto.includes('aleluia')) return "Aclamação ao Evangelho";
        if (texto.includes('ofertório') || texto.includes('ofertorio') || texto.includes('oferendas')) return "Ofertório";
        if (texto === 'santo' || texto.includes('santíssimo') || texto.includes('santissimo')) return "Santo";
        if (texto.includes('paz') || texto.includes('abraço')) return "Canto da Paz";
        if (texto.includes('cordeiro')) return "Cordeiro de Deus";
        if (texto.includes('comunhão') || texto.includes('comunhao')) return "Comunhão";
        if (texto.includes('ação de graças') || texto.includes('acao de gracas') || texto.includes('graças')) return "Ação de Graças";
        if (texto.includes('final') || texto.includes('encerramento') || texto.includes('saída') || texto.includes('saida')) return "Canto Final";
        if (texto.includes('mariano') || texto.includes('maria')) return "Canto Mariano";
        return texto.replace(/\b\w/g, char => char.toUpperCase());
    }
    
    // ==========================================
    // FUNÇÕES DE EDIÇÃO (MODAL)
    // ==========================================
    window.abrirModalEdicao = function(cat, id) {
        editandoId = id;
        editandoCatOriginal = cat;
        const musica = repertorio[cat][id];

        document.getElementById('edit-categoria').value = cat;
        document.getElementById('edit-nome').value = musica.nome;
        document.getElementById('edit-tom').value = musica.tom || '';
        document.getElementById('edit-letra').value = musica.letra || '';
        document.getElementById('edit-harmonia').checked = musica.harmonia || false;

        const tempo = musica.tempo || 'Geral (Qualquer Tempo)';
        if(tempo.startsWith('Festa: ')) {
            document.getElementById('edit-tempo').value = 'Festa';
            document.getElementById('edit-tempo-festa').value = tempo.replace('Festa: ', '');
            document.getElementById('edit-tempo-festa').style.display = 'block';
        } else {
            document.getElementById('edit-tempo').value = tempo;
            document.getElementById('edit-tempo-festa').style.display = 'none';
            document.getElementById('edit-tempo-festa').value = '';
        }

        document.getElementById('modal-edicao').style.display = 'block';
    };

    window.fecharModalEdicao = function() {
        document.getElementById('modal-edicao').style.display = 'none';
        editandoId = null;
        editandoCatOriginal = null;
    };

    document.getElementById('btn-salvar-edicao').addEventListener('click', () => {
        let categoriaInput = document.getElementById('edit-categoria').value.trim();
        const nome = document.getElementById('edit-nome').value.trim();
        const tom = document.getElementById('edit-tom').value.trim();
        const letra = document.getElementById('edit-letra').value.trim();
        const harmonia = document.getElementById('edit-harmonia').checked;
        
        let tempoFinal = document.getElementById('edit-tempo').value;
        if (tempoFinal === 'Festa') {
            const inputFesta = document.getElementById('edit-tempo-festa').value.trim();
            if(!inputFesta) {
                alert("Por favor, digite o nome da Festa!");
                return;
            }
            tempoFinal = "Festa: " + inputFesta;
        }

        if (!categoriaInput || !nome) {
            alert("Preencha ao menos o momento da missa e o nome da música!");
            return;
        }

        const categoriaNormalizada = normalizarCategoria(categoriaInput);
        const nomeNormalizado = nome.toLowerCase().trim();
        const letraNormalizada = letra ? letra.toLowerCase().replace(/\s/g, '') : ""; 

        // Crosscheck garantindo que não barra a própria música que está sendo editada
        let musicaDuplicada = false;
        let categoriaExistente = "";

        for (const [cat, musicasObj] of Object.entries(repertorio)) {
            if (!musicasObj) continue;
            for (const [id, musicaExistente] of Object.entries(musicasObj)) {
                if (id === editandoId && cat === editandoCatOriginal) continue; // Pula a própria música

                if (musicaExistente.nome && musicaExistente.nome.toLowerCase().trim() === nomeNormalizado) {
                    musicaDuplicada = true;
                    categoriaExistente = cat;
                    break;
                }
                if (letraNormalizada.length > 15 && musicaExistente.letra) {
                    const letraBanco = musicaExistente.letra.toLowerCase().replace(/\s/g, '');
                    if (letraBanco === letraNormalizada) {
                        musicaDuplicada = true;
                        categoriaExistente = cat;
                        break;
                    }
                }
            }
            if (musicaDuplicada) break;
        }

        if (musicaDuplicada) {
            alert(`Atenção: Já existe outra música igual cadastrada na categoria "${categoriaExistente}".`);
            return; 
        }

        const dadosAtualizados = {
            nome: nome,
            tom: tom, 
            letra: letra, 
            tempo: tempoFinal, 
            harmonia: harmonia
        };

        if (categoriaNormalizada !== editandoCatOriginal) {
            // Se mudou de categoria, remove da antiga e cria na nova
            remove(ref(db, 'repertorio/' + editandoCatOriginal + '/' + editandoId));
            set(ref(db, 'repertorio/' + categoriaNormalizada + '/' + editandoId), dadosAtualizados).then(() => {
                fecharModalEdicao();
            });
        } else {
            // Se manteve a categoria, apenas atualiza
            update(ref(db, 'repertorio/' + editandoCatOriginal + '/' + editandoId), dadosAtualizados).then(() => {
                fecharModalEdicao();
            });
        }
    });

    // ==========================================
    // FUNÇÕES DE ADIÇÃO E RENDERIZAÇÃO
    // ==========================================
    document.getElementById('btn-salvar').addEventListener('click', () => {
        let categoriaInput = document.getElementById('nova-categoria').value.trim();
        const nome = document.getElementById('nome-musica').value.trim();
        const tom = document.getElementById('tom-musica').value.trim();
        const letra = document.getElementById('letra-musica').value.trim();
        const harmonia = document.getElementById('tem-harmonia').checked;
        
        let tempoFinal = document.getElementById('tempo-musica').value;
        if (tempoFinal === 'Festa') {
            const inputFesta = document.getElementById('tempo-festa').value.trim();
            if(!inputFesta) {
                alert("Por favor, digite o nome da Festa!");
                return;
            }
            tempoFinal = "Festa: " + inputFesta;
        }

        if (!categoriaInput || !nome) {
            alert("Preencha ao menos o momento da missa e o nome da música!");
            return;
        }

        const categoria = normalizarCategoria(categoriaInput);
        const nomeNormalizado = nome.toLowerCase().trim();
        const letraNormalizada = letra ? letra.toLowerCase().replace(/\s/g, '') : ""; 

        let musicaDuplicada = false;
        let categoriaExistente = "";

        for (const [cat, musicasObj] of Object.entries(repertorio)) {
            if (!musicasObj) continue;
            for (const [id, musicaExistente] of Object.entries(musicasObj)) {
                if (musicaExistente.nome && musicaExistente.nome.toLowerCase().trim() === nomeNormalizado) {
                    musicaDuplicada = true;
                    categoriaExistente = cat;
                    break;
                }
                if (letraNormalizada.length > 15 && musicaExistente.letra) {
                    const letraBanco = musicaExistente.letra.toLowerCase().replace(/\s/g, '');
                    if (letraBanco === letraNormalizada) {
                        musicaDuplicada = true;
                        categoriaExistente = cat;
                        break;
                    }
                }
            }
            if (musicaDuplicada) break;
        }

        if (musicaDuplicada) {
            alert(`Atenção: Esta música já está cadastrada na categoria "${categoriaExistente}".`);
            return; 
        }

        const categoriaRef = ref(db, 'repertorio/' + categoria);
        const novaMusicaRef = push(categoriaRef);
        
        set(novaMusicaRef, {
            nome: nome,
            tom: tom, 
            letra: letra, 
            tempo: tempoFinal, 
            harmonia: harmonia
        }).then(() => {
            document.getElementById('nome-musica').value = '';
            document.getElementById('tom-musica').value = '';
            document.getElementById('letra-musica').value = '';
            document.getElementById('tempo-festa').value = '';
            document.getElementById('tempo-festa').style.display = 'none';
            document.getElementById('tempo-musica').value = 'Geral (Qualquer Tempo)';
            document.getElementById('tem-harmonia').checked = false;
        });
    });

    window.toggleCategoria = function(categoriaNome) {
        if (categoriasFechadas.has(categoriaNome)) {
            categoriasFechadas.delete(categoriaNome); 
        } else {
            categoriasFechadas.add(categoriaNome); 
        }
        renderizarLista();
    };

    window.removerMusica = function(categoria, idMusica) {
        if(confirm("Tem certeza que deseja apagar essa música?")) {
            remove(ref(db, 'repertorio/' + categoria + '/' + idMusica));
        }
    };

    window.removerCategoria = function(categoria) {
        if(confirm(`Tem certeza que deseja apagar a categoria "${categoria}" e todas as suas músicas?`)) {
            remove(ref(db, 'repertorio/' + categoria));
        }
    };

    function atualizarFiltrosDOM() {
        const filtroTempoSel = document.getElementById('filtro-tempo');
        const filtroCatSel = document.getElementById('filtro-categoria');
        
        const tempoAtual = filtroTempoSel.value;
        const catAtual = filtroCatSel.value;

        let temposSet = new Set();
        let categoriasSet = new Set();

        for (const [cat, musicasObj] of Object.entries(repertorio)) {
            categoriasSet.add(cat);
            if(musicasObj) {
                Object.values(musicasObj).forEach(m => {
                    temposSet.add(m.tempo || 'Geral (Qualquer Tempo)');
                });
            }
        }

        filtroTempoSel.innerHTML = '<option value="Todos">Todos os Tempos</option>';
        Array.from(temposSet).sort().forEach(t => {
            filtroTempoSel.innerHTML += `<option value="${t}">${t}</option>`;
        });
        filtroTempoSel.value = temposSet.has(tempoAtual) ? tempoAtual : 'Todos';

        filtroCatSel.innerHTML = '<option value="Todas">Todas as Categorias</option>';
        Array.from(categoriasSet).sort().forEach(c => {
            filtroCatSel.innerHTML += `<option value="${c}">${c}</option>`;
        });
        filtroCatSel.value = categoriasSet.has(catAtual) ? catAtual : 'Todas';
    }

    window.renderizarLista = function() {
        const container = document.getElementById('categorias-container');
        container.innerHTML = ''; 

        const filtroTempo = document.getElementById('filtro-tempo').value;
        const filtroCat = document.getElementById('filtro-categoria').value;

        const ordemMissa = [
            "Canto de Entrada", "Ato Penitencial", "Glória", "Aclamação ao Evangelho",
            "Ofertório", "Santo", "Canto da Paz", "Cordeiro de Deus", "Comunhão",
            "Ação de Graças", "Canto Final", "Canto Mariano"
        ];

        let categoriasAtuais = Object.keys(repertorio);
        categoriasAtuais.sort((a, b) => {
            let indexA = ordemMissa.indexOf(a);
            let indexB = ordemMissa.indexOf(b);
            if (indexA === -1) indexA = 999; 
            if (indexB === -1) indexB = 999;
            if (indexA !== indexB) return indexA - indexB;
            return a.localeCompare(b);
        });

        let temAlgoNaTela = false;

        categoriasAtuais.forEach((categoria) => {
            if (filtroCat !== 'Todas' && categoria !== filtroCat) return; 

            const musicasObj = repertorio[categoria];
            if (!musicasObj) return;

            let musicasArray = Object.entries(musicasObj);
            
            let musicasFiltradas = musicasArray.filter(([id, mus]) => {
                const tempoMus = mus.tempo || 'Geral (Qualquer Tempo)';
                return filtroTempo === 'Todos' || tempoMus === filtroTempo;
            });

            if (musicasFiltradas.length === 0) return;

            temAlgoNaTela = true;

            let divCategoria = document.createElement('div');
            divCategoria.className = 'categoria';
            
            let cabecalho = document.createElement('div');
            cabecalho.className = 'categoria-header';
            
            const estaFechada = categoriasFechadas.has(categoria);
            const icone = estaFechada ? '▶' : '▼';
            
            cabecalho.innerHTML = `
                <h3 onclick="toggleCategoria('${categoria}')" style="cursor:pointer; flex:1;">
                    ${icone} ${categoria} <span style="font-size:0.7em; font-weight:normal;">(${musicasFiltradas.length})</span>
                </h3> 
                <button class="btn-remover-cat" onclick="removerCategoria('${categoria}')">Apagar Categoria</button>
            `;
            divCategoria.appendChild(cabecalho);

            let divLista = document.createElement('div');
            divLista.style.display = estaFechada ? 'none' : 'block';

            musicasFiltradas.forEach(([idMusica, musica]) => {
                let divContainer = document.createElement('div');
                divContainer.className = 'musica-item-container';
                
                const tempoDisplay = musica.tempo || 'Geral (Qualquer Tempo)';
                const tLower = tempoDisplay.toLowerCase();
                
                if (tLower.includes('comum')) {
                    divContainer.classList.add('sombra-comum');
                } else if (tLower.includes('natal')) {
                    divContainer.classList.add('sombra-natal');
                } else if (tLower.includes('advento') || tLower.includes('quaresma')) {
                    divContainer.classList.add('sombra-advento-quaresma');
                } else if (tLower.includes('festa') || tLower.includes('paixão') || tLower.includes('ramos') || tLower.includes('santo')) {
                    divContainer.classList.add('sombra-festa');
                } else if (tLower.includes('páscoa') || tLower.includes('pascoa')) {
                    divContainer.classList.add('sombra-pascoa');
                } else {
                    divContainer.classList.add('sombra-geral');
                }

                if (musica.harmonia) {
                    divContainer.classList.add('harmonia-vocal');
                }

                let labelLinha = document.createElement('label');
                labelLinha.className = 'musica-linha';

                let checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = musica.nome;
                checkbox.dataset.categoria = categoria;
                checkbox.dataset.id = idMusica;
                checkbox.dataset.harmonia = musica.harmonia;
                checkbox.className = 'check-lista';

                labelLinha.appendChild(checkbox);
                labelLinha.appendChild(document.createTextNode(musica.nome));

                if (musica.tom) {
                    let tagTom = document.createElement('span');
                    tagTom.className = 'tag-tom';
                    tagTom.innerText = musica.tom;
                    labelLinha.appendChild(tagTom);
                }

                if (tempoDisplay !== 'Geral (Qualquer Tempo)') {
                    let tagTempo = document.createElement('span');
                    tagTempo.className = 'tag-tempo';
                    tagTempo.innerText = tempoDisplay;
                    labelLinha.appendChild(tagTempo);
                }

                if (musica.harmonia) {
                    let tag = document.createElement('span');
                    tag.className = 'tag-vozes';
                    tag.innerText = 'Vozes';
                    labelLinha.appendChild(tag);
                }

                // Cria os botões de ação (Editar e Remover)
                let divAcoes = document.createElement('div');
                divAcoes.className = 'acoes-musica';
                
                let btnEditar = document.createElement('button');
                btnEditar.className = 'btn-editar-musica';
                btnEditar.innerHTML = '✎';
                btnEditar.title = "Editar música";
                btnEditar.onclick = function(e) {
                    e.preventDefault(); 
                    window.abrirModalEdicao(categoria, idMusica);
                };

                let btnRemover = document.createElement('button');
                btnRemover.className = 'btn-remover-musica';
                btnRemover.innerHTML = '&times;';
                btnRemover.title = "Remover música";
                btnRemover.onclick = function(e) {
                    e.preventDefault(); 
                    window.removerMusica(categoria, idMusica);
                };
                
                divAcoes.appendChild(btnEditar);
                divAcoes.appendChild(btnRemover);
                labelLinha.appendChild(divAcoes);

                divContainer.appendChild(labelLinha);

                if (musica.letra) {
                    let details = document.createElement('details');
                    details.className = 'letra-detalhes';
                    let summary = document.createElement('summary');
                    summary.innerText = 'Ver Letra';
                    
                    let divLetra = document.createElement('div');
                    divLetra.className = 'letra-texto';
                    divLetra.innerText = musica.letra;
                    
                    details.appendChild(summary);
                    details.appendChild(divLetra);
                    divContainer.appendChild(details);
                }

                divLista.appendChild(divContainer);
            });

            divCategoria.appendChild(divLista);
            container.appendChild(divCategoria);
        });
        
        if (!temAlgoNaTela) {
            container.innerHTML = '<p style="text-align: center;">Nenhuma música encontrada para os filtros selecionados.</p>';
        }
    }

    document.getElementById('btn-gerar-lista').addEventListener('click', () => {
        const dataInput = document.getElementById('data-missa').value;
        if (!dataInput) {
            alert("Por favor, insira a data da missa antes de gerar a lista.");
            return;
        }

        const partesData = dataInput.split('-');
        const dataFormatada = `${partesData[2]}/${partesData[1]}/${partesData[0]}`;

        const checkboxes = document.querySelectorAll('input[type="checkbox"].check-lista:checked');
        const listaConteudo = document.getElementById('lista-final-conteudo');
        const listaContainer = document.getElementById('lista-final-container');
        
        listaConteudo.innerHTML = '';

        if (checkboxes.length === 0) {
            alert("Selecione pelo menos uma música marcando a caixinha ao lado do nome!");
            return;
        }

        document.getElementById('titulo-lista').innerText = `Lista da Missa - ${dataFormatada}`;

        checkboxes.forEach(cb => {
            let li = document.createElement('li');
            
            const cat = cb.dataset.categoria;
            const idMusica = cb.dataset.id;
            const musicaObj = repertorio[cat][idMusica];

            let texto = `<strong>${cat}:</strong> ${cb.value}`;
            
            if (musicaObj && musicaObj.tom) {
                texto += ` <span style="color: var(--marrom-escuro); font-weight: bold;">[${musicaObj.tom}]</span>`;
            }

            if (cb.dataset.harmonia === 'true') {
                texto += ' <em>(Harmonia Vocal)</em>';
            }
            li.innerHTML = texto;

            if (musicaObj && musicaObj.letra) {
                let details = document.createElement('details');
                details.className = 'letra-detalhes';
                let summary = document.createElement('summary');
                summary.innerText = 'Ver Letra';
                
                let divLetra = document.createElement('div');
                divLetra.className = 'letra-texto';
                divLetra.innerText = musicaObj.letra;
                
                details.appendChild(summary);
                details.appendChild(divLetra);
                li.appendChild(details);
            }

            listaConteudo.appendChild(li);
        });

        listaContainer.style.display = 'block';
        listaContainer.scrollIntoView({ behavior: "smooth" });
    });
</script>

</body>
</html>
